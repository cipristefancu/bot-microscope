name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Run Python & JS contract test suite
        run: pytest -q

      - name: Verify Chrome extension JS syntax & standalone contracts
        run: |
          node --check browser-extension/parser.js
          node --check browser-extension/content.js
          node --check browser-extension/background.js
          node --check browser-extension/popup.js
          node --check browser-extension/injected-interceptor.js
          node tests/js/parser_contract.js >/dev/null
          node tests/js/hud_inspector_contract.js >/dev/null
          node tests/js/background_contract.js >/dev/null

      - name: Smoke-test offline CLI report on bundled example
        run: python run_audit.py --input data/examples/_vlad.dumitrache_.csv --output output/ci_report.html --lang en
